# #338 — throwaway single-node NiFi whose authorizer is the CDP Base Ranger (RUNBOOK.md Phase 2).
# A SECOND CR on purpose: prod mynifi hosts the live Streamers flows; a Ranger lockout there costs real work.
# Same issuers / CA / image as files/cso-prod-1/nifi-cso-prod-1.yaml, so the existing nifi-admin cert logs in.
#
# Requires: operator >= 3.3.1-b15 (spec.security.ranger), Secret cfm-streaming/nifi-ranger-tls (Phase 2.1),
# the Ranger policies of Phase 2.2 ALREADY IN PLACE, and the CoreDNS line + tunnel (Phase 0).
apiVersion: cfm.cloudera.com/v1alpha1
kind: Nifi
metadata:
  name: nifi-ranger
  namespace: cfm-streaming
spec:
  replicas: 1
  nifiVersion: "2.6.0"
  image:
    repository: container.repository.cloudera.com/cloudera/cfm-nifi-k8s
    tag: 3.0.0-b126-nifi_2.6.0.4.3.4.0-234
    pullSecret: cloudera-creds
  tiniImage:
    repository: container.repository.cloudera.com/cloudera/cfm-tini
    tag: 3.0.0-b126
    pullSecret: cloudera-creds

  persistence:
    size: 5Gi
    storageClass: standard
    data:           { size: 2Gi, storageClass: standard }
    state:          { size: 1Gi, storageClass: standard }
    flowfileRepo:   { size: 2Gi, storageClass: standard }
    contentRepo:    { size: 5Gi, storageClass: standard }
    provenanceRepo: { size: 2Gi, storageClass: standard }

  hostName: nifi-ranger-web.nifi-ranger.cfm-streaming.svc.cluster.local
  uiConnection:
    type: Ingress
    ingressConfig:
      hostname: ""
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: HTTPS
      nginx.ingress.kubernetes.io/ssl-passthrough: "true"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"

  security:
    initialAdminIdentity: "nifi-admin"
    userCertAuth:
      verificationCASecret: cert-manager/cfm-operator-ca-tls
    nodeCertGen:
      issuerRef:
        name: cfm-operator-ca-issuer-signed
        kind: ClusterIssuer
    s2sCertGen:
      issuerRef:
        name: cfm-operator-ca-issuer-signed
        kind: ClusterIssuer
    # The authorizer. Renders RangerNiFiAuthorizer + ranger-nifi-security.xml / ranger-nifi-audit.xml /
    # ranger-policymgr-ssl.xml; sets nifi.security.user.authorizer=ranger-nifi-authorizer.
    # No `audit:` — the cluster's Solr is Kerberized and the plugin has no Kerberos login (would 401).
    # Phase 3.3 swaps this block for `configSecretName: nifi-ranger-custom-config` to add the file audit sink.
    ranger:
      serviceName: nifi-operator
      adminURL: https://steven-ce-sdx-01.cldr.internal:6182
      adminIdentity: "CN=steven-ce-sdx-01.cldr.internal, ST=CA, C=US"
      policyPollIntervalMs: 15000
      tls:
        secretName: nifi-ranger-tls

  configOverride:
    nifiProperties:
      upsert:
        nifi.cluster.leader.election.implementation: KubernetesLeaderElectionManager

  resources:
    nifi:
      requests: { memory: 2Gi, cpu: "1" }
      limits:   { memory: 2Gi }
