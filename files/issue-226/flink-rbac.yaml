# RBAC for FlinkDeployments on NvidiaSpark-1's k3s — carried unchanged from
# files/cso-prod-1/flink-agents/rbac.yaml. The flink-kubernetes-operator admission webhook
# requires spec.serviceAccount, and the JobManager needs these rights to manage TM pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  namespace: cld-streaming
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink
  namespace: cld-streaming
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "services", "secrets", "events"]
    verbs: ["create", "get", "list", "watch", "update", "delete", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["create", "get", "list", "watch", "update", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink
  namespace: cld-streaming
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: cld-streaming
roleRef:
  kind: Role
  name: flink
  apiGroup: rbac.authorization.k8s.io
