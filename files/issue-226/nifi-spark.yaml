# NiFi on NvidiaSpark-1's own k3s — Phase 4 (F, #238).
# Carried from files/cso-prod-1/nifi-cso-prod-1.yaml (CFM operator 3.0.0-b126, NiFi 2.6.0,
# userCertAuth + S2S day one off the same CA issuers) with the k3s deltas from k3s-cso §4:
#   - storageClass local-path everywhere ('standard' is minikube's; it does not exist here)
#   - sizes are generous: the box has 3.7 TB of NVMe, and prod's emptyDir repos are the reason
#     a pod delete there wipes a flow
#   - the Ingress route is real here: ingress-nginx is installed WITH --enable-ssl-passthrough
#     (the flag minikube's addon omits, which is why prod's route 502s — #254), host-network :443
#   - a real memory request. On prod mynifi runs BestEffort and is the first thing OOM-killed
#     when the node is tight; k3s-cso §5 budgets 8 GB here.
# Apply files/cso-prod-1/cluster-issuer.yaml BEFORE this CR — the node/S2S issuerRefs and the
# userCertAuth truststore all point at cfm-operator-ca-issuer-signed / cert-manager/cfm-operator-ca-tls.
# The custom-python-extensions PVC block from prod is deliberately NOT carried: no custom Python
# processor is in scope for the Phase-4 gate. Add it (and the PVC) when a demo needs one.
apiVersion: cfm.cloudera.com/v1alpha1
kind: Nifi
metadata:
  name: mynifi
  namespace: cfm-streaming
spec:
  replicas: 1
  nifiVersion: "2.6.0"
  image:
    repository: container.repository.cloudera.com/cloudera/cfm-nifi-k8s
    tag: 3.0.0-b126-nifi_2.6.0.4.3.4.0-234
    pullSecret: cloudera-creds
  tiniImage:
    repository: container.repository.cloudera.com/cloudera/cfm-tini
    tag: 3.0.0-b126
    pullSecret: cloudera-creds

  persistence:
    size: 10Gi
    storageClass: local-path
    data:           { size: 10Gi, storageClass: local-path }
    state:          { size:  5Gi, storageClass: local-path }
    flowfileRepo:   { size: 10Gi, storageClass: local-path }
    contentRepo:    { size: 50Gi, storageClass: local-path }
    provenanceRepo: { size: 20Gi, storageClass: local-path }

  hostName: mynifi-web.mynifi.cfm-streaming.svc.cluster.local
  uiConnection:
    type: Ingress
    ingressConfig:
      hostname: ""
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: HTTPS
      nginx.ingress.kubernetes.io/ssl-passthrough: "true"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"

  security:
    initialAdminIdentity: "nifi-admin"
    userCertAuth:
      verificationCASecret: cert-manager/cfm-operator-ca-tls
    nodeCertGen:
      issuerRef:
        name: cfm-operator-ca-issuer-signed
        kind: ClusterIssuer
    s2sCertGen:
      issuerRef:
        name: cfm-operator-ca-issuer-signed
        kind: ClusterIssuer

  configOverride:
    nifiProperties:
      upsert:
        nifi.cluster.leader.election.implementation: KubernetesLeaderElectionManager
        nifi.web.prometheus.metrics.authenticated: "false"
        nifi.remote.input.host: mynifi-0.mynifi.cfm-streaming.svc.cluster.local
        nifi.remote.input.secure: "true"
        nifi.remote.input.http.enabled: "true"

  # The operator's own field, not a statefulset passthrough: spec.resources.{nifi,log,s2s}.
  # 8 GB per k3s-cso §5 — on prod mynifi runs BestEffort and is the first pod the kernel kills.
  resources:
    nifi:
      requests: { memory: 8Gi, cpu: "2" }
      limits:   { memory: 8Gi }

  stateManagement:
    clusterProvider:
      id: kubernetes-provider
      class: org.apache.nifi.kubernetes.state.provider.KubernetesConfigMapStateProvider
