# Deltas vs the fork's k8s/game/20-game.yaml:
#   - nginx config mounted from ConfigMap game-nginx (upstream retarget, image stock)
#   - Service gains NodePort 30080 -> stable http://192.168.49.2:30080 from WSL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game
  namespace: cloudera-racing-standalone
  labels: { app: game }
spec:
  replicas: 1
  selector: { matchLabels: { app: game } }
  template:
    metadata:
      labels: { app: game }
    spec:
      containers:
        - name: game
          image: racing/game:2.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /nginx-ping, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-conf
          configMap: { name: game-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: game
  namespace: cloudera-racing-standalone
spec:
  type: NodePort
  selector: { app: game }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
