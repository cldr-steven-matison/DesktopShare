# Delta vs the fork: /api/metrics upstream retargeted from the fork's own
# racing-nifi-listen:9999 to the live mynifi's headless-service FQDN (ListenHTTP
# on 9999 — reachable with no Service/CR change, same rail as the StreamersApp
# Trigger on 9080). Mounted over /etc/nginx/conf.d/default.conf so the image
# stays stock.
apiVersion: v1
kind: ConfigMap
metadata:
  name: game-nginx
  namespace: cloudera-racing-standalone
data:
  default.conf: |
    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
            add_header X-Frame-Options "SAMEORIGIN";
        }

        # -- Telemetry POSTs -> NiFi ListenHTTP (live mynifi, cfm-streaming) --
        location /api/metrics {
            proxy_pass http://mynifi.cfm-streaming.svc.cluster.local:9999/contentListener;
            proxy_set_header Host $host;
            proxy_set_header Content-Type application/json;
            proxy_read_timeout 5s;
            proxy_connect_timeout 2s;
        }

        # -- Dashboard -> leaderboard service (Kafka consumer) --
        location = /leaderboard {
            proxy_pass http://leaderboard:3000/leaderboard;
            proxy_set_header Host $host;
        }
        location /api/leaderboard {
            proxy_pass http://leaderboard:3000/api/leaderboard;
            proxy_set_header Host $host;
            proxy_read_timeout 5s;
            proxy_connect_timeout 2s;
        }

        location /nginx-ping { return 200 "pong\n"; add_header Content-Type text/plain; }
    }
