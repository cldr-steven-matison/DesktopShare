# game_metrics topic on the live CSM Kafka — matches the convention of the five
# existing KafkaTopic CRs in cld-streaming (dashed CR name, underscored topicName).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: game-metrics
  namespace: cld-streaming
  labels:
    strimzi.io/cluster: my-cluster
spec:
  topicName: game_metrics
  partitions: 3
  replicas: 3
  config:
    cleanup.policy: delete
    min.insync.replicas: "2"
    retention.ms: "604800000"
