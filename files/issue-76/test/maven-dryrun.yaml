      containers:
        - name: build
          image: docker.io/library/maven:3.9-eclipse-temurin-21
          imagePullPolicy: IfNotPresent
          command: ["bash", "/entry/entrypoint.sh"]
          env:
            - name: TAG
              value: "nifi-maven-2.4.0-RC2"
            - name: ARTIFACT_URL
              value: "https://dist.apache.org/repos/dist/release/nifi/nifi-nar-maven-plugin-2.4.0"
            - name: SHA512
              value: "dd19299576da5086c3101df5a60ea9b37fb0ecc09e19a83d64ac3d153faec6601f93941ce8d621b776cb132579cde7480b03f7c8cd23b53f86bc2dbea58bad20"
            - name: KEYS_URL
              value: "https://dist.apache.org/repos/dist/release/nifi/KEYS"
            - name: GIT_REPO
              value: "apache/nifi-maven"
          volumeMounts:
            - name: entry
              mountPath: /entry
          resources:
            requests:
              cpu: "2"
