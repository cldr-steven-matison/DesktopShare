# Issue #76 — Stage 5 terminus: the release_vote_recommendations topic on the
# box's my-cluster (cld-streaming). Topic management on this stack is KafkaTopic
# CRs only (CLI create/delete does not work here). 30-day retention — a
# recommendation is a decision record, not ephemeral telemetry.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: release-vote-recommendations
  namespace: cld-streaming
  labels:
    strimzi.io/cluster: my-cluster
spec:
  topicName: release_vote_recommendations
  partitions: 3
  replicas: 3
  config:
    cleanup.policy: delete
    min.insync.replicas: "2"
    retention.ms: "2592000000"
