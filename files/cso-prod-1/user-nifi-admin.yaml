# Admin access for the human/automation identity on cso-prod-1, granted the operator-native way
# (never hand-POST users/policies to REST — 500 → torn authorizations.xml → CrashLoop).
# Identity = the mapped DN of nifi-admin-cert (no SAN on that cert, so NiFi uses subject DN via
# identity.mapping ^CN=(.*?), ?O=(.*?) -> "CN=$1, O=$2").
apiVersion: cfm.cloudera.com/v1alpha1
kind: User
metadata:
  name: nifi-admin
  namespace: cfm-streaming
spec:
  identity: "CN=nifi-admin, O=Cloudera"
  instanceTarget:
    kind: Nifi
    name: mynifi
    namespace: cfm-streaming
  accessPolicies:
    - actions: [read, write]
      resources:
        - /flow
        - /controller
        - /process-groups/root
        - /data/process-groups/root
        - /parameter-contexts
        - /tenants
        - /policies
        - /restricted-components
        - /provenance
        - /counters
    - actions: [read]
      resources:
        - /site-to-site
        - /system
