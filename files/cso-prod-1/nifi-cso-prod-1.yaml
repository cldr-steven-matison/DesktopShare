# cso-prod-1 NiFi CR — CFM operator 3.0.0-b126, NiFi 2.6.0
# Secure + Site-to-Site FROM DAY ONE (#116). userCertAuth (singleUserAuth cannot hold S2S peer policies).
# #253 cutover: custom-python-extensions PVC mounted (six live processors across StreamersApp /
# TwitchChatBot / WatchlistChatJoiner are Python) — same block as prod's mynifi. Apply
# python-extensions-loader.yaml + the PVC BEFORE this CR so the mount binds on first start.
# Issuers: apply cluster-issuer.yaml FIRST (same artifact as prod — ClouderaStreamingOperators/cluster-issuer.yaml):
# selfSigned cfm-operator-ca-issuer -> CA cert cert-manager/cfm-operator-ca-tls -> CA ClusterIssuer
# cfm-operator-ca-issuer-signed. Node/S2S certs off that CA issuer, and the SAME CA as verificationCASecret,
# so any peer cert minted off cfm-operator-ca-issuer-signed (SAN = User identity) is trusted for S2S.
# Do not use the operator's selfSigned issuer (cfm-operator-nifi-nodes-ca) — it puts no CA in the truststore.
apiVersion: cfm.cloudera.com/v1alpha1
kind: Nifi
metadata:
  name: mynifi
  namespace: cfm-streaming
spec:
  replicas: 1
  nifiVersion: "2.6.0"
  image:
    repository: container.repository.cloudera.com/cloudera/cfm-nifi-k8s
    tag: 3.0.0-b126-nifi_2.6.0.4.3.4.0-234
    pullSecret: cloudera-creds
  tiniImage:
    repository: container.repository.cloudera.com/cloudera/cfm-tini
    tag: 3.0.0-b126
    pullSecret: cloudera-creds

  # Persistence on minikube's default 'standard' StorageClass (nifi-storage does not exist here)
  persistence:
    size: 5Gi
    storageClass: standard
    data:           { size:  5Gi, storageClass: standard }
    state:          { size:  2Gi, storageClass: standard }
    flowfileRepo:   { size:  5Gi, storageClass: standard }
    contentRepo:    { size: 10Gi, storageClass: standard }
    provenanceRepo: { size:  5Gi, storageClass: standard }

  hostName: mynifi-web.mynifi.cfm-streaming.svc.cluster.local
  uiConnection:
    type: Ingress
    ingressConfig:
      hostname: ""
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: HTTPS
      nginx.ingress.kubernetes.io/ssl-passthrough: "true"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"

  # === Security: userCertAuth + S2S day-one ===
  security:
    initialAdminIdentity: "nifi-admin"
    userCertAuth:
      verificationCASecret: cert-manager/cfm-operator-ca-tls
    nodeCertGen:
      issuerRef:
        name: cfm-operator-ca-issuer-signed
        kind: ClusterIssuer
    s2sCertGen:
      issuerRef:
        name: cfm-operator-ca-issuer-signed
        kind: ClusterIssuer

  configOverride:
    nifiProperties:
      upsert:
        nifi.cluster.leader.election.implementation: KubernetesLeaderElectionManager
        nifi.web.prometheus.metrics.authenticated: "false"
        # custom Python processors (prod parity)
        nifi.python.extensions.directories: ./python_extensions,/opt/nifi/nifi-current/python/extensions
        # S2S transport (HTTP, secure) — day one
        nifi.remote.input.host: mynifi-0.mynifi.cfm-streaming.svc.cluster.local
        nifi.remote.input.secure: "true"
        nifi.remote.input.http.enabled: "true"

  # custom Python processors — identical to prod mynifi's statefulset block
  statefulset:
    env:
      - name: NIFI_PYTHON_LISTENER_STARTUP_TIMEOUT
        value: "600 sec"
      - name: NIFI_PYTHON_PROXIED_LOG_LEVEL
        value: DEBUG
    volumeMounts:
      - name: python-extensions
        mountPath: /opt/nifi/nifi-current/python/extensions
    volumes:
      - name: python-extensions
        persistentVolumeClaim:
          claimName: custom-python-extensions

  stateManagement:
    clusterProvider:
      id: kubernetes-provider
      class: org.apache.nifi.kubernetes.state.provider.KubernetesConfigMapStateProvider
