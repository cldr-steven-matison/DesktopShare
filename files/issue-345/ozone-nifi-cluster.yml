# Ozone-enabled Base Cluster with NiFi and NiFi Registry (CFM 4.10.0.0 / NiFi 2.3) grafted in.
# Copy of ozone-cluster.yml; every difference is tagged '# NIFI GRAFT'.
#
# https://docs.cloudera.com/cdp-private-cloud-data-services/1.5.4/installation-ecs/topics/cdppvc-installation-base-software-requirements.html

- name: Configure hosts for Ozone Base cluster services
  hosts: base
  gather_facts: true
  become: true
  tags:
    - prereqs
  roles:
    - role: cloudera.exe.prereq_kafka
    - role: cloudera.exe.prereq_atlas
    - role: cloudera.exe.prereq_hbase
    - role: cloudera.exe.prereq_hdfs
    - role: cloudera.exe.prereq_hive
    - role: cloudera.exe.prereq_knox
    - role: cloudera.exe.prereq_ranger
    - role: cloudera.exe.prereq_yarn
    - role: cloudera.exe.prereq_zookeeper
    - role: cloudera.exe.prereq_nifi          # NIFI GRAFT
    - role: cloudera.exe.prereq_nifiregistry  # NIFI GRAFT

- name: Configure databases for Ozone Base cluster services
  hosts: postgresql
  gather_facts: true
  become: true
  tags:
    - databases
  vars:
    database_type: "postgresql"
    database_host: "{{ groups['postgresql'] | first }}"
    # database_admin_user:      # Set in config.yml as global var
    # database_admin_password:  # Set in config.yml as global var
  roles:
    - role: cloudera.exe.prereq_ranger_database
    - role: cloudera.exe.prereq_hive_database
    - role: cloudera.exe.prereq_knox_database
      when: cloudera_runtime_version is version('7.3.1', 'ge', version_type='loose')
    # NIFI GRAFT: database only; no SCHEMAREGISTRY service is established in this template (SR + SMM deferred).
    - role: cloudera.exe.prereq_schemaregistry_database
      when: cloudera_runtime_version is version('7.3.1', 'ge', version_type='loose')

- name: Configure reverse proxy for Ozone Base cluster services
  hosts: reverse_proxy
  gather_facts: true
  become: true
  tags:
    - reverse_proxy
  vars:
    tf_inventory: "{{ playbook_dir }}/../tf_cluster_aws"
    external_subdomain: "{{ lookup('cloud.terraform.tf_output', 'gateways', project_path=tf_inventory) | map(attribute='public_ip') | first }}"
    caddy_service: caddy
  handlers:
    - name: Reload Caddy
      ansible.builtin.service:
        name: caddy
        state: reloaded
  tasks:
    - name: Install Knox reverse proxy
      ansible.builtin.template:
        src: knox.caddyfile.j2
        dest: /etc/caddy/Caddyfile.d/knox.caddyfile
        mode: "0644"
      vars:
        external_domain: "knox.{{ external_subdomain }}.{{ public_domain }}"
        knox_proxy_fqdn: "{{ groups['knox_gateway'] | first }}"
      notify: Reload Caddy

- name: Configure parcels and CSDs for Ozone Base cluster services
  hosts: cloudera_manager
  gather_facts: false
  become: true
  tags:
    - csds
  module_defaults:
    group/cloudera.cluster.deployment:
      host: "cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
      port: 80
      username: admin
      password: "{{ cloudera_manager_admin_password }}"
      ssl_ca_cert: "{{ caddy_ca_pem | default(omit) }}"
      verify_tls: "{{ (caddy_self_signed is defined and caddy_ca_pem is undefined) | ternary('no', 'yes') }}"
  tasks:
    - name: Install available CSDs
      ansible.builtin.include_role:
        name: cloudera.exe.cm_csd
      vars:
        cm_license_path: "{{ lookup('env', 'CDP_LICENSE_FILE') }}"
        cloudera_manager_repo_username: "{{ lookup('cloudera.cluster.cm_license', cm_license_path).uuid }}"
        cloudera_manager_repo_password: "{{ lookup('cloudera.cluster.cm_license', cm_license_path).password }}"
        cloudera_manager_csd_restarted: true
        # NIFI GRAFT: CFM 4.10.0.0 CSDs appended to whatever config/group_vars define
        cloudera_manager_csds: "{{ cloudera_parcel_csds + cfm_csds }}"
        cfm_csds:
          - https://archive.cloudera.com/p/cfm2/4.10.0.0/redhat9/yum/tars/parcel/NIFI-2.3.0.4.10.0.0-154.jar
          - https://archive.cloudera.com/p/cfm2/4.10.0.0/redhat9/yum/tars/parcel/NIFIREGISTRY-2.3.0.4.10.0.0-154.jar

    - name: Check availablity of Cloudera Manager
      ansible.builtin.wait_for:
        port: 7183
        delay: 10
        timeout: 240
        sleep: 10

    - name: Configure available parcels
      cloudera.cluster.cm_config:
        parameters:
          # NIFI GRAFT: CFM parcel repo appended
          remote_parcel_repo_urls: "{{ (cloudera_parcel_repo_urls + ['https://archive.cloudera.com/p/cfm2/4.10.0.0/redhat9/yum/tars/parcel/']) | join(',') }}"
      delegate_to: localhost
      become: false

- name: Provision Ozone Base cluster core
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    # These should be set in per-host role overrides by reading values from inventory (host variables)
    dfs_data_dir_list: "/dfs/dn"
    dfs_name_dir_list: "/dfs/nn"
    fs_checkpoint_dir_list: "/dfs/snn"
    yarn_nodemanager_local_dirs: "/yarn/nm"
    kafka_zookeeper_chroot: "/kafka"
    zookeeper_data_dir: "/var/lib/zookeeper"
    zookeeper_data_log_dir: "/var/lib/zookeeper"
  module_defaults:
    group/cloudera.cluster.deployment:
      host: "cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
      port: 80
      username: admin
      password: "{{ cloudera_manager_admin_password }}"
      ssl_ca_cert: "{{ caddy_ca_pem | default(omit) }}"
      verify_tls: "{{ (caddy_self_signed is defined and caddy_ca_pem is undefined) | ternary('no', 'yes') }}"
  handlers:
    - name: Services updated
      ansible.builtin.set_fact:
        services_updated: true
  tags:
    - cluster
  tasks:
    - name: Set persistent cluster status
      ansible.builtin.set_fact:
        services_updated: false

    - name: Establish the cluster
      tags:
        - core
        - atlas
        - hbase
        - hdfs
        - hive
        - hive_on_tez
        - kafka
        - ozone
        - ranger
        - sdx
        - solr
        - tez
        - yarn
        - zookeeper
        - host_template
      cloudera.cluster.cluster:
        name: ozone-base-cluster
        display_name: Ozone Base
        type: BASE_CLUSTER
        cluster_version: "{{ cloudera_runtime_release }}"
      register: __cluster
      notify: Services updated

    - name: Establish core settings service
      tags:
        - core
      cloudera.cluster.service:
        cluster: ozone-base-cluster
        name: "{{ __cluster.cloudera_manager.tags['_cldr_cluster.core_settings.service_name'] }}"
        type: CORE_SETTINGS
        config:
          hadoop_security_authorization: true
          hadoop_security_authentication: "kerberos"
      notify: Services updated

- name: Provision Ozone Base cluster hosts
  hosts: base
  gather_facts: false
  module_defaults:
    group/cloudera.cluster.deployment:
      host: "cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
      port: 80
      username: admin
      password: "{{ cloudera_manager_admin_password }}"
      ssl_ca_cert: "{{ caddy_ca_pem | default(omit) }}"
      verify_tls: "{{ (caddy_self_signed is defined and caddy_ca_pem is undefined) | ternary('no', 'yes') }}"
  tags:
    - cluster
    - hosts
    - parcels
  tasks:
    - name: Provision host to cluster
      delegate_to: localhost
      cloudera.cluster.host:
        name: "{{ inventory_hostname }}" # str
        cluster: ozone-base-cluster

- name: Provision Ozone Base cluster parcels
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/cloudera.cluster.deployment:
      host: "cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
      port: 80
      username: admin
      password: "{{ cloudera_manager_admin_password }}"
      ssl_ca_cert: "{{ caddy_ca_pem | default(omit) }}"
      verify_tls: "{{ (caddy_self_signed is defined and caddy_ca_pem is undefined) | ternary('no', 'yes') }}"
  tags:
    - cluster
    - parcels
  tasks:
    - name: Activate parcels
      cloudera.cluster.parcel:
        cluster: ozone-base-cluster
        name: "{{ __parcel.key }}"
        parcel_version: "{{ __parcel.value }}"
        state: "activated"
      # NIFI GRAFT: CFM layered on top of the CDH pin from config/group_vars (never replace cloudera_parcels)
      loop: "{{ (cloudera_parcels | combine({'CFM': '4.10.0.0-154'})) | dict2items }}"
      loop_control:
        loop_var: __parcel
        label: "{{ __parcel.value }}"

- name: Install additional JDK for CFM parcel version is 4.x+   # NIFI GRAFT (from nifi2.0-cluster.yml)
  hosts: cluster
  gather_facts: yes
  become: yes
  tags:
    - nifi
    - jdkk
  roles:
    - cloudera.exe.prereq_jdk
  vars:
    additional_jdk_packages:
      - zulu21-jdk
    additional_jdk_repository: "https://cdn.azul.com/zulu/bin/zulu-repo-1.0.0-1.noarch.rpm"
    additional_jdk_key: "https://repos.azul.com/azul-repo.key"

- name: Provision Ozone Base cluster services
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    # These should be set in per-host role overrides by reading values from inventory (host variables)
    base_dn: "{{ dns_domain.split('.') | map('regex_replace', '^(.*)$', 'dc=\\1') | join(',') }}"
    dfs_data_dir_list: "/dfs/dn"
    dfs_name_dir_list: "/dfs/nn"
    fs_checkpoint_dir_list: "/dfs/snn"
    yarn_nodemanager_local_dirs: "/yarn/nm"
    kafka_zookeeper_chroot: "/kafka"
    zookeeper_data_dir: "/var/lib/zookeeper"
    zookeeper_data_log_dir: "/var/lib/zookeeper"
  module_defaults:
    group/cloudera.cluster.deployment:
      host: "cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
      port: 80
      username: admin
      password: "{{ cloudera_manager_admin_password }}"
      ssl_ca_cert: "{{ caddy_ca_pem | default(omit) }}"
      verify_tls: "{{ (caddy_self_signed is defined and caddy_ca_pem is undefined) | ternary('no', 'yes') }}"
  handlers:
    - name: Services updated
      ansible.builtin.set_fact:
        services_updated: true
  tags:
    - cluster
    - services
  tasks:
    - name: Get reference to cluster
      tags:
        - core
        - atlas
        - flink
        - hbase
        - hdfs
        - hive
        - hive_on_tez
        - kafka
        - ozone
        - ranger
        - sdx
        - solr
        - ssb
        - tez
        - yarn
        - zookeeper
        - host_template
      cloudera.cluster.cluster:
        name: ozone-base-cluster
      register: __cluster

    - name: Establish ZooKeeper service
      tags:
        - atlas
        - hbase
        - ranger
        - sdx
        - solr
        - zookeeper
        - host_template
      cloudera.cluster.service:
        cluster: ozone-base-cluster
        name: zookeeper
        type: ZOOKEEPER
        config:
          quorum_auth_enable_sasl: true
          enableSecurity: true
        role_config_groups:
          - type: SERVER
            config:
              dataDir: "{{ zookeeper_data_dir }}"
              dataLogDir: "{{ zookeeper_data_log_dir }}"
              # NIFI GRAFT: AutoTLS + enableSecurity turn the plaintext client port off; the CFM 4.10
              # NiFi CSD start script pre-checks the quorum on the non-secure port (2181) and exits 1
              # without it. NiFi itself still talks TLS on 2182.
              zookeeper_enable_client_port: true
      register: __zookeeper
      notify: Services updated

    - name: Establish HDFS service
      tags:
        - atlas
        - hbase
        - hdfs
        - hive
        - hive_on_tez
        - ranger
        - sdx
        - solr
        - yarn
        - zookeeper
        - host_template
      cloudera.cluster.service:
        cluster: ozone-base-cluster
        name: hdfs
        type: HDFS
        config:
          dfs_encrypt_data_transfer_algorithm: AES/CTR/NoPadding
          hadoop_secure_web_ui: true
          core_connector: "{{ __cluster.cloudera_manager.tags['_cldr_cluster.core_settings.service_name'] }}"
          # NIFI GRAFT: the libhadoop bundled in CFM's nifi-ranger NAR segfaults inside OpenSSL 3.5.x
          # (ENGINE_get_cipher) on the first encrypted HDFS write (Ranger audit); the pure-Java AES codec
          # avoids the native path for every HDFS client, NiFi included.
          core_site_safety_valve: "<property><name>hadoop.security.crypto.codec.classes.aes.ctr.nopadding</name><value>org.apache.hadoop.crypto.JceAesCtrCryptoCodec</value></property>"
          # zookeeper_service: "{{ __zookeeper.service.name }}"
        role_config_groups:
          - type: DATANODE
            config:
              dfs_data_dir_list: "{{ dfs_data_dir_list | string }}"
          - type: NAMENODE
            config:
              dfs_name_dir_list: "{{ dfs_name_dir_list | string }}"
          - type: SECONDARYNAMENODE
            config:
              fs_checkpoint_dir_list: "{{ fs_checkpoint_dir_list | string }}"
      register: __hdfs
      notify: Services updated

    - name: Establish Solr service
      tags:
        - atlas
        - ozone
        - ranger
        - sdx
        - solr
        - host_template
      cloudera.cluster.service:
        cluster: ozone-base-cluster
        name: solr
        type: SOLR
        config:
          solr_security_authentication: kerberos
          hdfs_service: "{{ __hdfs.service.name }}"
          zookeeper_service: "{{ __zookeeper.service.name }}"
          # ranger_service: "{{ __ranger.service.name }}"
      register: __solr
      notify: Services updated

    - name: Establish Ranger service credentials
      tags:
        - ranger
        - sdx
        - host_template
      cloudera.cluster.service:
        cluster: ozone-base-cluster
        name: ranger
        type: RANGER
        config:
          rangerusersync_user_password: "{{ ranger_password }}"
          rangertagsync_user_password: "{{ ranger_password }}"
          keyadmin_user_password: "{{ ranger_password }}"
          ranger_database_password: "{{ ranger_password }}"
          rangeradmin_user_password: "{{ ranger_password }}"
        skip_redacted: true

    - name: Establish Ranger service
      tags:
        - ranger
        - sdx
        - host_template
      cloudera.cluster.service:
        cluster: ozone-base-cluster
        name: ranger
        type: RANGER
        config:
          ranger_database_host: "{{ groups['postgresql'] | first }}"
          hdfs_service: "{{ __hdfs.service.name }}"
          solr_service: "{{ __solr.service.name }}"
        role_config_groups:
          - type: RANGER_USERSYNC
            config:
              ranger.usersync.ldap.url: "ldaps://{{ groups['freeipa'] | first }}"
              ranger.usersync.ldap.binddn: "uid=ldap_bind_user,cn=users,cn=accounts,{{ base_dn }}"
              ranger_usersync_ldap_ldapbindpassword: "{{ common_password }}"
              ranger.usersync.ldap.user.searchbase: "cn=users,cn=accounts,{{ base_dn }}"
              ranger.usersync.ldap.user.objectclass: "person"
              ranger.usersync.ldap.user.nameattribute: "uid"
              ranger.usersync.group.searchbase: "cn=groups,cn=accounts,{{ base_dn }}"
              ranger.usersync.group.objectclass: "ipausergroup"
              ranger.usersync.group.nameattribute: "cn"
              ranger.usersync.group.memberattributename: "member"
      register: __ranger
      notify: Services updated

    - name: Establish YARN service
      tags:
        - hive
        - hive_on_tez
        - tez
        - yarn
        - host_template
      cloudera.cluster.service:
        cluster: ozone-base-cluster
        name: yarn
        type: YARN
        config:
          hadoop_secure_web_ui: true
          hdfs_service: "{{ __hdfs.service.name }}"
          # ranger_service: "{{ __ranger.service.name }}"
          # zookeeper_service: "{{ __zookeeper.service.name }}"
        role_config_groups:
          - type: NODEMANAGER
            config:
              yarn_nodemanager_local_dirs: "{{ yarn_nodemanager_local_dirs | string }}"
          - type: GATEWAY
            config:
              mapred_submit_replication: "{{ groups['cluster'] | map('extract', hostvars) | selectattr('host_template', 'eq', 'Worker') | length }}"
      register: __yarn
      notify: Services updated

    - name: Establish Tez service
      tags:
        - hive
        - hive_on_tez
        - tez
        - host_template
      cloudera.cluster.service:
        cluster: ozone-base-cluster
        name: tez
        type: TEZ
        config:
          yarn_service: "{{ __yarn.service.name }}"
      register: __tez
      notify: Services updated

    - name: Establish Ozone service
      tags:
        - ozone
      cloudera.cluster.service:
        cluster: ozone-base-cluster
        name: ozone
        type: OZONE
        config:
          ozone.scm.primordial.node.id: "{{ groups['cluster'] | map('extract', hostvars) | selectattr('host_template', 'eq', 'Master1') | map(attribute='inventory_hostname') | first }}"
          ozone.service.id: o3service1
          ozone.security.enabled: true
          # hdfs_service: "{{ __hdfs.service.name }}"
          # ranger_service: "{{ __ranger.service.name }}"
          solr_service: "{{ __solr.service.name }}"
          # NIFI GRAFT edit 12 (#345, 2026-09-16): AutoTLS sets ssl_enabled on the SCM/OM/DN roles and CM then
          # generates hdds.grpc.tls.enabled=true. Ozone's CSR builder drops the DNS SAN for any *.cldr.internal
          # name (commons-validator has no `internal` TLD), the SCM certs carry an IP-only SAN, and Ratis verifies
          # the FQDN peer address against that cert, so the SCM ring never forms. Ring TLS off keeps everything
          # else (Kerberos RPC, HTTPS UIs) as is. The valve is emitted BEFORE the generated value, so it needs
          # <final>true</final> or the generated true wins. Proven live on srm-cloudera-ce-base 15:31 UTC.
          ozone-conf/ozone-site.xml_service_safety_valve: >-
            <property>
              <name>hdds.grpc.tls.enabled</name>
              <value>false</value>
              <final>true</final>
            </property>
        role_config_groups:
          - type: STORAGE_CONTAINER_MANAGER
            config:
              ozone-conf/ozone-site.xml_role_safety_valve: >-
                <property>
                  <name>hdds.scm.safemode.enabled</name>
                  <value>false</value>
                </property>
      register: __ozone
      notify: Services updated

    - name: Establish Kafka service
      tags:
        - atlas
        - kafka
        - sdx
        - host_template
      cloudera.cluster.service:
        cluster: ozone-base-cluster
        name: kafka
        type: KAFKA
        config:
          zookeeper_service: "{{ __zookeeper.service.name }}"
          zookeeper.chroot: "{{ kafka_zookeeper_chroot }}"
          # ranger_service: "{{ __ranger.service.name }}"
          # hdfs_service: "{{ __hdfs.service.name }}"
          kerberos.auth.enable: true
          service_triggers: "{{ triggers | to_json }}"
      vars:
        triggers:
          - triggerName: Kafka Broker Log Directory Free Capacity Check
            enabled: true
            expressionEditorConfig:
            streamThreshold: 0
            validityWindowInMs: 120000
            suppressed: false
            triggerExpression: >-
              IF (
                SELECT kafka_log_directory_disk_free_space/kafka_log_directory_disk_total_space
                WHERE serviceName=$SERVICENAME
                AND last(kafka_log_directory_disk_free_space/kafka_log_directory_disk_total_space) < 0.1
              )
              DO health:bad
      register: __kafka
      notify: Services updated

    - name: Establish HBase service
      tags:
        - atlas
        - hbase
        - sdx
        - host_template
      cloudera.cluster.service:
        cluster: ozone-base-cluster
        name: hbase
        type: HBASE
        config:
          hbase_thriftserver_security_authentication: auth-conf
          hbase_security_authentication: kerberos
          hbase_security_authorization: true
          hdfs_service: "{{ __hdfs.service.name }}"
          zookeeper_service: "{{ __zookeeper.service.name }}"
          ranger_service: "{{ __ranger.service.name }}"
          # atlas_service: "{{ __atlas.service.name }}"
      register: __hbase
      notify: Services updated

    - name: Establish Atlas service
      tags:
        - atlas
        - sdx
        - host_template
      cloudera.cluster.service:
        cluster: ozone-base-cluster
        name: atlas
        type: ATLAS
        config:
          kerberos.auth.enable: true
          hdfs_service: "{{ __hdfs.service.name }}"
          hbase_service: "{{ __hbase.service.name }}"
          kafka_service: "{{ __kafka.service.name }}"
          solr_service: "{{ __solr.service.name }}"
          ranger_service: "{{ __ranger.service.name }}"
      register: __atlas
      notify: Services updated

    - name: Establish Hive service credentials
      tags:
        - hive
        - hive_on_tez
        - tez
        - host_template
      cloudera.cluster.service:
        cluster: ozone-base-cluster
        name: hive
        type: HIVE
        config:
          hive_metastore_database_password: "{{ hive_password }}"
        skip_redacted: true

    - name: Establish Hive service
      tags:
        - hive
        - hive_on_tez
        - tez
        - host_template
      cloudera.cluster.service:
        cluster: ozone-base-cluster
        name: hive
        type: HIVE
        config:
          hive_metastore_database_host: "{{ groups['postgresql'] | first }}"
          hive_metastore_database_type: postgresql
          hive_metastore_database_name: hive
          hive_metastore_database_port: 5432
          hdfs_service: "{{ __hdfs.service.name }}"
          zookeeper_service: "{{ __zookeeper.service.name }}"
          mapreduce_yarn_service: "{{ __yarn.service.name }}"
          ranger_service: "{{ __ranger.service.name }}"
          hbase_service: "{{ __hbase.service.name }}"
          atlas_service: "{{ __atlas.service.name }}"
      register: __hive
      notify: Services updated

    - name: Establish Hive-on-Tez service
      tags:
        - hive_on_tez
        - host_template
      cloudera.cluster.service:
        cluster: ozone-base-cluster
        name: hive_on_tez
        type: HIVE_ON_TEZ
        config:
          hdfs_service: "{{ __hdfs.service.name }}"
          hms_connector: "{{ __hive.service.name }}"
          tez_service: "{{ __tez.service.name }}"
          mapreduce_yarn_service: "{{ __yarn.service.name }}"
          zookeeper_service: "{{ __zookeeper.service.name }}"
          ranger_service: "{{ __ranger.service.name }}"
          hbase_service: "{{ __hbase.service.name }}"
          atlas_service: "{{ __atlas.service.name }}"
      register: __hive_on_tez
      notify: Services updated

    - name: Establish Knox service
      tags:
        - knox
        - host_template
      cloudera.cluster.service:
        cluster: ozone-base-cluster
        name: knox
        type: KNOX
        config:
          knox_gateway_database_password: "{{ knox_db_enabled | ternary(knox_password, omit) }}"
          knox_gateway_database_host: "{{ knox_db_enabled | ternary(groups['postgresql'] | first, omit) }}"
          knox_gateway_database_user: "{{ knox_db_enabled | ternary('knox', omit) }}"
          knox_gateway_database_name: "{{ knox_db_enabled | ternary('knox', omit) }}"
          kerberos.auth.enabled: true
          ranger_service: "{{ __ranger.service.name }}"
          hdfs_service: "{{ __hdfs.service.name }}"
          "conf/gateway-site.xml_service_safety_valve": >-
            <property>
              <name>gateway.frontend.url</name>
              <value>https://knox.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}/gateway</value>
            </property>
          knoxsso_redirect_whitelist_regex: "^https?:\\/\\/(.*pvc\\.cloudera-labs\\.com)(?::[0-9]+)?(?:\\/.*)?$"
        role_config_groups:
          - type: KNOX_GATEWAY
            config:
              gateway_master_secret: "{{ knox_password }}"
              gateway_dispatch_whitelist: "^https?:\\/\\/(.*\\.cldr\\.internal)(?::[0-9]+)?(?:\\/.*)?$"
        skip_redacted: true
      vars:
        knox_db_enabled: "{{ cloudera_runtime_version is version('7.3.1', 'ge', version_type='loose') }}"
      register: __knox
      # notify: Services updated # Always returns TRUE until we have the suppress_redacted flag enabled

    # NIFI GRAFT (from nifi2.0-cluster.yml, cluster renamed)
    - name: Establish Nifi service
      tags:
        - nifi
        - host_template
      cloudera.cluster.service:
        cluster: ozone-base-cluster
        name: nifi
        type: NIFI
        config:
          hdfs_service: "{{ __hdfs.service.name }}"
          ranger_service: "{{ __ranger.service.name }}"
          knox_service: "{{ __knox.service.name }}"
          zookeeper_service: "{{ __zookeeper.service.name }}"
          atlas_service: "{{ __atlas.service.name }}"
          kerberos.auth.enabled: true
        role_config_groups:
          - type: NIFI_NODE
            config:
              nifi.web.https.port: 8444
              nifi.jdk.home: "/usr/lib/jvm/zulu21"
      register: __nifi
      notify: Services updated

    - name: Establish Nifi Registry service
      tags:
        - nifiregistry
        - host_template
      cloudera.cluster.service:
        cluster: ozone-base-cluster
        name: nifiregistry
        type: NIFIREGISTRY
        config:
          hdfs_service: "{{ __hdfs.service.name }}"
          ranger_service: "{{ __ranger.service.name }}"
          knox_service: "{{ __knox.service.name }}"
          nifi_service: "{{ __nifi.service.name }}"
          kerberos.auth.enabled: true
        role_config_groups:
          - type: NIFI_REGISTRY_SERVER
            config:
              nifi.registry.jdk.home: "/usr/lib/jvm/zulu21"
      register: __nifiregistry
      notify: Services updated

    - name: Enable AutoTLS on the cluster (post-services configuration)
      tags:
        - cluster
        - tls
      cloudera.cluster.cluster:
        name: ozone-base-cluster
        auto_tls: true
      notify: Services updated

    # SDX, Worker, Master1, Master2, Master3
    - name: Establish SDX host template
      tags:
        - host_template
      cloudera.cluster.host_template:
        cluster: ozone-base-cluster
        name: SDX
        role_config_groups:
          - service: "{{ __atlas.service.name }}"
            type: ATLAS_SERVER
          - service: "{{ __hdfs.service.name }}"
            type: BALANCER
          - service: "{{ __hive.service.name }}"
            type: GATEWAY
          - service: "{{ __knox.service.name }}"
            type: KNOX_GATEWAY
          - service: "{{ __ozone.service.name }}"
            type: GATEWAY
          - service: "{{ __ozone.service.name }}"
            type: OZONE_RECON
          - service: "{{ __ozone.service.name }}"
            type: S3_GATEWAY
          - service: "{{ __ranger.service.name }}"
            type: RANGER_ADMIN
          - service: "{{ __ranger.service.name }}"
            type: RANGER_TAGSYNC
          - service: "{{ __ranger.service.name }}"
            type: RANGER_USERSYNC
          - service: "{{ __tez.service.name }}"
            type: GATEWAY
      notify: Services updated

    - name: Establish Master1 host template
      tags:
        - host_template
      cloudera.cluster.host_template:
        cluster: ozone-base-cluster
        name: Master1
        role_config_groups:
          - service: "{{ __hbase.service.name }}"
            type: MASTER
          - service: "{{ __hdfs.service.name }}"
            type: NAMENODE
          - service: "{{ __ozone.service.name }}"
            type: OZONE_MANAGER
          - service: "{{ __ozone.service.name }}"
            type: STORAGE_CONTAINER_MANAGER
          - service: "{{ __zookeeper.service.name }}"
            type: SERVER
      notify: Services updated

    - name: Establish Master2 host template
      tags:
        - host_template
      cloudera.cluster.host_template:
        cluster: ozone-base-cluster
        name: Master2
        role_config_groups:
          - service: "{{ __hbase.service.name }}"
            type: MASTER
          - service: "{{ __ozone.service.name }}"
            type: OZONE_MANAGER
          - service: "{{ __ozone.service.name }}"
            type: STORAGE_CONTAINER_MANAGER
          - service: "{{ __yarn.service.name }}"
            type: JOBHISTORY
          - service: "{{ __yarn.service.name }}"
            type: RESOURCEMANAGER
          - service: "{{ __zookeeper.service.name }}"
            type: SERVER
      notify: Services updated

    - name: Establish Master3 host template
      tags:
        - host_template
      cloudera.cluster.host_template:
        cluster: ozone-base-cluster
        name: Master3
        role_config_groups:
          - service: "{{ __hbase.service.name }}"
            type: MASTER
          - service: "{{ __hdfs.service.name }}"
            type: SECONDARYNAMENODE
          - service: "{{ __hive.service.name }}"
            type: HIVEMETASTORE
          - service: "{{ __hive_on_tez.service.name }}"
            type: HIVESERVER2
          - service: "{{ __ozone.service.name }}"
            type: OZONE_MANAGER
          - service: "{{ __ozone.service.name }}"
            type: STORAGE_CONTAINER_MANAGER
          - service: "{{ __solr.service.name }}"
            type: SOLR_SERVER
          - service: "{{ __zookeeper.service.name }}"
            type: SERVER
          - service: "{{ __kafka.service.name }}"
            type: KRAFT
          - service: "{{ __nifiregistry.service.name }}"   # NIFI GRAFT
            type: GATEWAY
          - service: "{{ __nifiregistry.service.name }}"   # NIFI GRAFT
            type: NIFI_REGISTRY_SERVER
      notify: Services updated

    - name: Establish Worker host template
      tags:
        - host_template
      cloudera.cluster.host_template:
        cluster: ozone-base-cluster
        name: Worker
        role_config_groups:
          - service: "{{ __hbase.service.name }}"
            type: REGIONSERVER
          - service: "{{ __hdfs.service.name }}"
            type: DATANODE
          - service: "{{ __kafka.service.name }}"
            type: KAFKA_BROKER
          - service: "{{ __ozone.service.name }}"
            type: OZONE_DATANODE
          - service: "{{ __yarn.service.name }}"
            type: NODEMANAGER
          - service: "{{ __nifi.service.name }}"   # NIFI GRAFT
            type: NIFI_NODE
      notify: Services updated

- name: Provision Ozone Base cluster role instances to hosts
  hosts: base
  gather_facts: false
  module_defaults:
    group/cloudera.cluster.deployment:
      host: "cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
      port: 80
      username: admin
      password: "{{ cloudera_manager_admin_password }}"
      ssl_ca_cert: "{{ caddy_ca_pem | default(omit) }}"
      verify_tls: "{{ (caddy_self_signed is defined and caddy_ca_pem is undefined) | ternary('no', 'yes') }}"
  tags:
    - cluster
    - roles
  tasks:
    - name: Provision host to cluster
      delegate_to: localhost
      cloudera.cluster.host:
        name: "{{ inventory_hostname }}" # str
        cluster: ozone-base-cluster
        host_template: "{{ host_template | default(omit) }}"
        # roles: # See role overrides note above in the cluster set up
        #   - service: # str
        #     type: # str
        #     config: # dict

- name: Manage Ozone Base cluster state
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/cloudera.cluster.deployment:
      host: "cm.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}"
      port: 80
      username: admin
      password: "{{ cloudera_manager_admin_password }}"
      ssl_ca_cert: "{{ caddy_ca_pem | default(omit) }}"
      verify_tls: "{{ (caddy_self_signed is defined and caddy_ca_pem is undefined) | ternary('no', 'yes') }}"
  tags:
    - cluster
    - state
  tasks:
    - name: Ensure Ozone Base cluster started
      cloudera.cluster.cluster:
        name: ozone-base-cluster
        state: "{{ services_updated | default(False) | ternary('restarted', 'started') }}"
        force: true # Force first run

    - name: Reset cluster status variable
      when: services_updated is defined
      ansible.builtin.set_fact:
        services_updated: false

    - name: Query CMS status
      cloudera.cluster.cm_service_info:
      register: __cms

    - name: Refresh CMS configuration
      when: __cms.service.config_staleness_status == "STALE"
      cloudera.cluster.cm_service:
        state: restarted
