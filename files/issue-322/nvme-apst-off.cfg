# /etc/default/grub.d/nvme-apst-off.cfg — spark-dd06 (#322, 2026-09-12). Installed by install.sh step 0.
#
# The Samsung NVMe (MZALC4T0HBL1-00B07, fw NXHB202Q) hung in a low-power state on every boot from
# 2026-09-12 06:10 UTC: I/O timeouts, "Device not ready; aborting reset, CSTS=0x1", every process
# D-state on nvme0n1 while the kernel still answered ping. Keeping the controller out of APST and the
# link out of ASPM stops it. A boot without these two parameters froze in 56-97 s, seven times.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT nvme_core.default_ps_max_latency_us=0 pcie_aspm=off"
# Show the GRUB menu for 3 s so a bad boot can be caught at the console (added in the same triage).
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=3
